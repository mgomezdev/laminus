pid /tmp/laminus-nginx.pid;
error_log /dev/stderr;
events {}

http {
    access_log off;
    server {
        listen 5000;
        client_max_body_size 0;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /api/v1 { proxy_pass http://127.0.0.1:5001; }
        location /api/v1/ { proxy_pass http://127.0.0.1:5001; }
        location = /openapi-v1.json {
            proxy_pass http://127.0.0.1:5001/openapi.json;
        }
        location = /openapi-v2.json {
            proxy_pass http://127.0.0.1:5002/openapi.json;
        }
        location = /openapi.json {
            alias /etc/laminus/openapi.json;
            default_type application/json;
        }
        location / { proxy_pass http://127.0.0.1:5002; }
    }
}
