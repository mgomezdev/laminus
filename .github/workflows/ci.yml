name: ci

# Laminus already had solid unit tests, but nothing ran them on a pull request --
# the workflow only triggered on push to main, after the merge it should have
# gated. This adds the pull-request trigger, and the cross-service check that
# matters for the one repo Themis is tightly coupled to.

on:
  pull_request:
  push:
    branches: [main, develop]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request into develop that touches only documentation (docs/**, any *.md) sets code=false and every job
  # below is skipped: no mock image, no cross-service e2e. Pushes, tags, release pull requests into main and any pull
  # request with one other file run everything; so does a diff that cannot be computed. No test reads a docs file
  # (if one ever does, exclude that path here). Branch rulesets should require the `gate` job at the bottom: a check
  # created inside a called workflow ("e2e-core / e2e") does not exist when its caller is skipped.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          code=true
          # --no-renames: a code file renamed into docs/ is listed under its old path too.
          if [ "$EVENT" = "pull_request" ] && [ "$BASE_REF" != "main" ] && files="$(git diff --name-only --no-renames "$BASE_SHA"...HEAD)" && [ -n "$files" ]; then
            # Count the paths that are neither under docs/ nor a Markdown file. Counted from a here-string, not
            # `printf | grep -q`: with pipefail, grep -q exiting early kills printf on a long list and the pipeline
            # reads as "no match", i.e. docs-only.
            other="$(grep -cvE '^docs/|\.md$' <<<"$files" || true)"
            if [ "$other" = "0" ]; then code=false; fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  spec:
    needs: [changes]
    if: needs.changes.outputs.code != 'false'      # anything but an explicit docs-only verdict runs the job
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt
      - run: python scripts/export_openapi.py
      - name: Fail if spec is stale
        run: git diff --exit-code openapi.json openapi-v1.json

  test:
    needs: [changes]
    if: needs.changes.outputs.code != 'false'      # anything but an explicit docs-only verdict runs the job
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # xvfb-run must exist on PATH even with the fake slicer, because every
      # OrcaSlicer invocation is wrapped in it unconditionally.
      - name: Install system dependencies
        run: sudo apt-get install -y xvfb

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify dashboard v1 integration
        run: node --test tests/test_dashboard_v1.mjs

      # mock/orca_cli.py stands in for the real 200 MB AppImage so the suite
      # never downloads it. tests/test_mock_contract.py separately asserts the
      # HTTP mock and the real app satisfy identical contracts -- which is what
      # lets Themis gate against mock-laminus instead of real OrcaSlicer.
      # LAMINUS_CONTRACT_REQUIRE_REAL=1 below makes that suite's real half fail
      # rather than skip when the real app has no catalog. It used to skip on
      # every run (the fixture never started the app's lifespan), so the
      # "identical contracts" claim was only being checked against the mock.
      - name: Install mock OrcaSlicer
        run: |
          chmod +x mock/orca_cli.py
          sudo ln -sf "$(pwd)/mock/orca_cli.py" /usr/local/bin/orcaslicer

      - name: Run tests
        env:
          SYSTEM_PROFILES_DIR: ${{ github.workspace }}/tests/fixtures/profiles
          USER_CONFIG_DIR: /tmp/laminus-test-user
          CONFIG_DIR: /tmp/laminus-test-config
          DATA_DIR: /tmp/laminus-test-data
          LAMINUS_CONTRACT_REQUIRE_REAL: "1"
        run: pytest tests/ -v -ra

  # Browser e2e for the dashboard: the real app (uvicorn) against mock/orca_cli.py,
  # driven through Chromium. e2e/conftest.py shims orcaslicer + xvfb-run itself.
  e2e-ui:
    needs: [changes]
    if: needs.changes.outputs.code != 'false'      # anything but an explicit docs-only verdict runs the job
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            e2e/requirements.txt
      - run: pip install -r requirements.txt -r e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest e2e -v -ra --tracing retain-on-failure
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7

  # Build the mock image this change produces and hand it to the cross-service
  # suite. Themis's e2e runs entirely against this mock, so a change that breaks
  # it breaks Themis -- that has to surface on the Laminus pull request, not
  # later on an unrelated Themis one.
  mock-image:
    needs: [changes]
    if: needs.changes.outputs.code != 'false'      # anything but an explicit docs-only verdict runs the job
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build mock image
        uses: docker/build-push-action@v6
        with:
          context: mock
          push: false
          load: true
          tags: laminus-mock:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image
        run: docker save laminus-mock:ci -o /tmp/laminus-mock-ci.tar

      - uses: actions/upload-artifact@v4
        with:
          name: laminus-mock-ci-image
          path: /tmp/laminus-mock-ci.tar
          retention-days: 1

  # Core checks Themis with the mock built above; Ordinus has its own integration gate.
  e2e-core:
    needs: [mock-image]
    # A called workflow's token is capped by the caller's; Concordia's e2e logs
    # into GHCR with it.
    permissions:
      contents: read
      packages: read
    uses: mgomezdev/concordia/.github/workflows/e2e.yml@main
    with:
      # Concordia has no develop branch; its maintained integration suite is on main.
      concordia_ref: main
      profile: core
      image_artifact: laminus-mock-ci-image
      mock_laminus_image: laminus-mock:ci
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  publish:
    needs: [spec, test, e2e-ui, mock-image, e2e-core]
    # develop pushes run the checks but don't publish images
    if: github.event_name == 'push' && github.ref != 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/mgomezdev/laminus
            ninjabuffalo/laminus
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
              || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (mock)
        id: meta-mock
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/mgomezdev/laminus-mock
            ninjabuffalo/laminus-mock
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
              || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Build and push mock image
        uses: docker/build-push-action@v6
        with:
          context: mock
          push: true
          tags: ${{ steps.meta-mock.outputs.tags }}
          labels: ${{ steps.meta-mock.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attach spec to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            openapi.json
            openapi-v1.json

  # The one check a branch ruleset should require (see `changes`). Always runs; green only when every job it needs
  # succeeded or was skipped.
  gate:
    needs: [changes, spec, test, e2e-ui, mock-image, e2e-core]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          bad = {job: n["result"] for job, n in needs.items() if n["result"] not in ("success", "skipped")}
          if needs["changes"]["result"] != "success":
              bad["changes"] = needs["changes"]["result"]     # the filter itself may never be skipped
          print("failed:", bad or "none")
          sys.exit(1 if bad else 0)
          PY
