[pytest]
# Without this, bare `pytest` (as CI's workflow invokes it) never adds the repo
# root to sys.path, so `from app.main import ...` / `from tests.conftest import ...`
# fail to collect. `python -m pytest` masks this locally because that invocation
# form adds the cwd to sys.path on its own.
pythonpath = .
# Tests use explicit @pytest.mark.asyncio, not auto-detection.
asyncio_mode = strict
